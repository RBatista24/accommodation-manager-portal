# Local PostgreSQL for development and tests.
# Host port 5433 avoids clashing with a PostgreSQL you may already run on 5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: amp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: amp
      POSTGRES_PASSWORD: amp
      POSTGRES_DB: amp_dev
    ports:
      - "5433:5432"
    volumes:
      - amp-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amp -d amp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amp-pgdata:
